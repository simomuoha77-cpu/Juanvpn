name: JUAN VPN Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build native tunnel engine (hev-socks5-tunnel)
        run: |
          set -e
          J=app/src/main/jni
          mkdir -p $J
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel $J/hev-socks5-tunnel
          echo "--- JNI signatures in this hev version ---"
          grep -n "TProxy" $J/hev-socks5-tunnel/src/hev-jni.c | head -40 || true
          python3 - <<'PY'
          import re
          src = open('app/src/main/jni/hev-socks5-tunnel/src/hev-jni.c').read()
          rows = re.findall(r'\{\s*"(\w+)"\s*,\s*"(\([^"]*\)[^"]*)"', src)
          T = {'V':'void','Z':'boolean','B':'byte','C':'char','S':'short','I':'int','J':'long','F':'float','D':'double'}
          def parse(t, i=0):
              arr = 0
              while t[i] == '[':
                  arr += 1; i += 1
              if t[i] == 'L':
                  j = t.index(';', i); name = t[i+1:j].split('/')[-1]; i = j + 1
              else:
                  name = T[t[i]]; i += 1
              return name + '[]' * arr, i
          out = []
          for n, s in rows:
              args = s[1:s.index(')')]; ret = s[s.index(')')+1:]
              ps = []; i = 0; k = 0
              while i < len(args):
                  t, i = parse(args, i); ps.append(t + ' a' + str(k)); k += 1
              r, _ = parse(ret)
              out.append('    public static native ' + r + ' ' + n + '(' + ', '.join(ps) + ');')
          if out:
              code = 'package hev.htproxy;\n\npublic class TProxyService {\n    static { System.loadLibrary("hev-socks5-tunnel"); }\n' + '\n'.join(out) + '\n}\n'
              open('app/src/main/java/hev/htproxy/TProxyService.java', 'w').write(code)
              print(code)
          else:
              print('No JNI table found; keeping committed TProxyService.java')
          PY
          printf 'include $(call all-subdir-makefiles)\n' > $J/Android.mk
          printf 'APP_OPTIM := release\nAPP_PLATFORM := android-24\nAPP_ABI := armeabi-v7a arm64-v8a x86 x86_64\nAPP_CFLAGS := -O3 -DPKGNAME=hev/htproxy\nAPP_SUPPORT_FLEXIBLE_PAGE_SIZES := true\n' > $J/Application.mk
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cd app/src/main
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk NDK_LIBS_OUT="$PWD/jniLibs" NDK_OUT="$PWD/../../build/ndk-obj" -j4
          ls -R jniLibs
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build Hysteria + DNSTT engines (optional, never fails the APK build)
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="$PWD/app/src/main/jniLibs"
          W="$(mktemp -d)"
          TAG=$(git ls-remote --tags --refs https://github.com/apernet/hysteria 'refs/tags/app/v2.*' | sed 's#.*/tags/##' | sort -V | tail -1)
          echo "Hysteria tag: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/apernet/hysteria "$W/hysteria" || echo "hysteria clone failed"
          git clone --depth 1 https://www.bamsoftware.com/git/dnstt.git "$W/dnstt" || echo "dnstt clone failed"
          one() { # abi goarch clang-prefix goarm
            mkdir -p "$OUT/$1"
            export GOOS=android GOARCH="$2" CGO_ENABLED=1 CC="$BIN/$3-clang" GOARM="$4"
            LD="-s -w -linkmode external -extldflags -Wl,-z,max-page-size=16384"
            ( cd "$W/hysteria/app" && go build -trimpath -ldflags "$LD" -o "$OUT/$1/libhysteria.so" . ) || echo "hysteria $1 FAILED"
            ( cd "$W/dnstt/dnstt-client" && go build -trimpath -ldflags "$LD" -o "$OUT/$1/libdnstt.so" . ) || echo "dnstt $1 FAILED"
          }
          one arm64-v8a   arm64 aarch64-linux-android23 ""
          one armeabi-v7a arm   armv7a-linux-androideabi23 7
          one x86_64      amd64 x86_64-linux-android23 ""
          one x86         386   i686-linux-android23 ""
          ls -la "$OUT"/*/libhysteria.so "$OUT"/*/libdnstt.so || true
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK (shrunk/obfuscated, self-signed)
        run: |
          gradle assembleRelease --stacktrace || {
            echo "=== R8 suggested rules (missing_rules.txt) ==="
            cat app/build/outputs/mapping/release/missing_rules.txt 2>/dev/null || echo "(no missing_rules.txt)"
            exit 1
          }
      - name: Verify APKs (signature, minSdk, size)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for A in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "=== $A ($(du -h "$A" | cut -f1)) ==="
            "$BT/apksigner" verify --verbose --print-certs "$A" | head -12
            "$BT/aapt2" dump badging "$A" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
            unzip -tq "$A"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: juan-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: juan-vpn-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
