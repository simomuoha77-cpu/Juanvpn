name: JUAN VPN Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build native tunnel engine (hev-socks5-tunnel)
        run: |
          set -e
          J=app/src/main/jni
          mkdir -p $J
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel $J/hev-socks5-tunnel
          echo "--- JNI signatures in this hev version ---"
          grep -n "TProxy" $J/hev-socks5-tunnel/src/hev-jni.c | head -40 || true
          python3 - <<'PY'
          import re
          src = open('app/src/main/jni/hev-socks5-tunnel/src/hev-jni.c').read()
          rows = re.findall(r'\{\s*"(\w+)"\s*,\s*"(\([^"]*\)[^"]*)"', src)
          T = {'V':'void','Z':'boolean','B':'byte','C':'char','S':'short','I':'int','J':'long','F':'float','D':'double'}
          def parse(t, i=0):
              arr = 0
              while t[i] == '[':
                  arr += 1; i += 1
              if t[i] == 'L':
                  j = t.index(';', i); name = t[i+1:j].split('/')[-1]; i = j + 1
              else:
                  name = T[t[i]]; i += 1
              return name + '[]' * arr, i
          out = []
          for n, s in rows:
              args = s[1:s.index(')')]; ret = s[s.index(')')+1:]
              ps = []; i = 0; k = 0
              while i < len(args):
                  t, i = parse(args, i); ps.append(t + ' a' + str(k)); k += 1
              r, _ = parse(ret)
              out.append('    public static native ' + r + ' ' + n + '(' + ', '.join(ps) + ');')
          if out:
              code = 'package hev.htproxy;\n\npublic class TProxyService {\n    static { System.loadLibrary("hev-socks5-tunnel"); }\n' + '\n'.join(out) + '\n}\n'
              open('app/src/main/java/hev/htproxy/TProxyService.java', 'w').write(code)
              print(code)
          else:
              print('No JNI table found; keeping committed TProxyService.java')
          PY
          printf 'include $(call all-subdir-makefiles)\n' > $J/Android.mk
          printf 'APP_OPTIM := release\nAPP_PLATFORM := android-24\nAPP_ABI := armeabi-v7a arm64-v8a x86 x86_64\nAPP_CFLAGS := -O3 -DPKGNAME=hev/htproxy\nAPP_SUPPORT_FLEXIBLE_PAGE_SIZES := true\n' > $J/Application.mk
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cd app/src/main
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk NDK_LIBS_OUT="$PWD/jniLibs" NDK_OUT="$PWD/../../build/ndk-obj" -j4
          ls -R jniLibs
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Get Hysteria + DNSTT engines (optional, never fails the APK build)
        continue-on-error: true
        run: |
          go version
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="$PWD/app/src/main/jniLibs"
          W="$(mktemp -d)"
          is_elf() { [ -s "$1" ] && [ "$(head -c4 "$1" | od -An -c | tr -d ' ')" = '177ELF' ]; }

          # ---------- Hysteria ----------
          TAG=$(git ls-remote --tags --refs https://github.com/apernet/hysteria 'refs/tags/app/v2.*' | sed 's#.*/tags/##' | sort -V | tail -1)
          echo "Hysteria release: $TAG"
          ENC=$(printf '%s' "$TAG" | sed 's#/#%2F#')
          hy() { # abi release-suffix goarch clang goarm
            mkdir -p "$OUT/$1"; F="$OUT/$1/libhysteria.so"
            curl -fL --retry 3 -o "$F" "https://github.com/apernet/hysteria/releases/download/$ENC/hysteria-android-$2" || true
            if is_elf "$F"; then echo "hysteria $1: downloaded"; chmod 755 "$F"; return 0; fi
            echo "hysteria $1: download failed, building from source"
            [ -d "$W/hysteria" ] || git clone --depth 1 --branch "$TAG" https://github.com/apernet/hysteria "$W/hysteria" || return 1
            ( cd "$W/hysteria/app" && GOOS=android GOARCH="$3" GOARM="$5" CGO_ENABLED=1 CC="$BIN/$4-clang" \
                go build -trimpath -ldflags "-s -w" -o "$F" . ) \
              || ( cd "$W/hysteria/app" && GOOS=linux GOARCH="$3" GOARM="$5" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$F" . ) \
              || { echo "hysteria $1: FAILED"; rm -f "$F"; return 1; }
            echo "hysteria $1: built"
          }
          hy arm64-v8a   arm64 arm64 aarch64-linux-android23 ""
          hy armeabi-v7a armv7 arm   armv7a-linux-androideabi23 7
          hy x86_64      amd64 amd64 x86_64-linux-android23 ""
          hy x86         386   386   i686-linux-android23 ""

          # ---------- DNSTT (built from source) ----------
          git clone --depth 1 https://www.bamsoftware.com/git/dnstt.git "$W/dnstt" || echo "dnstt: git clone failed"
          if [ ! -d "$W/dnstt/dnstt-client" ]; then
            echo "dnstt: trying the Go module proxy"
            mkdir -p "$W/mod" && ( cd "$W/mod" && go mod init x >/dev/null 2>&1; \
              D=$(go mod download -json www.bamsoftware.com/git/dnstt.git@latest | python3 -c "import sys,json;print(json.load(sys.stdin)['Dir'])") && cp -r "$D" "$W/dnstt" && chmod -R u+w "$W/dnstt" ) || echo "dnstt: module download failed"
          fi
          dn() { # abi goarch clang goarm
            mkdir -p "$OUT/$1"; F="$OUT/$1/libdnstt.so"
            ( cd "$W/dnstt/dnstt-client" && GOOS=android GOARCH="$2" GOARM="$4" CGO_ENABLED=1 CC="$BIN/$3-clang" \
                go build -trimpath -ldflags "-s -w" -o "$F" . ) \
              || ( cd "$W/dnstt/dnstt-client" && GOOS=linux GOARCH="$2" GOARM="$4" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$F" . ) \
              || { echo "dnstt $1: FAILED"; rm -f "$F"; return 1; }
            echo "dnstt $1: built"
          }
          dn arm64-v8a   arm64 aarch64-linux-android23 ""
          dn armeabi-v7a arm   armv7a-linux-androideabi23 7
          dn x86_64      amd64 x86_64-linux-android23 ""
          dn x86         386   i686-linux-android23 ""

          echo "=== engines in jniLibs ==="
          ls -la "$OUT"/*/libhysteria.so "$OUT"/*/libdnstt.so 2>&1 || true
      - name: Report engines
        if: always()
        run: |
          OUT=app/src/main/jniLibs
          for E in libhysteria.so libdnstt.so; do
            for A in arm64-v8a armeabi-v7a x86_64 x86; do
              if [ -s "$OUT/$A/$E" ]; then echo "OK      $E $A"; else echo "::warning::MISSING $E for $A (the app will say the engine is not included)"; fi
            done
          done
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release APK (shrunk/obfuscated, self-signed)
        run: |
          gradle assembleRelease --stacktrace || {
            echo "=== R8 suggested rules (missing_rules.txt) ==="
            cat app/build/outputs/mapping/release/missing_rules.txt 2>/dev/null || echo "(no missing_rules.txt)"
            exit 1
          }
      - name: Verify APKs (signature, minSdk, size)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for A in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "=== $A ($(du -h "$A" | cut -f1)) ==="
            "$BT/apksigner" verify --verbose --print-certs "$A" | head -12
            "$BT/aapt2" dump badging "$A" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
            unzip -tq "$A"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: juan-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: juan-vpn-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: HJ01 security regression tests
        run: |
          set -e
          curl -fsSL -o /tmp/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          BCJAR=/tmp/bcprov.jar sh security-tests/run.sh
