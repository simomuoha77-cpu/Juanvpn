const o={tunnel:'ss',xProto:'ss',xMethod:method,xSecret:pw,xHost:hp.slice(0,hi).replace(/^\[|\]$/g,''),xPort:hp.slice(hi+1),xNet:'tcp',xTls:false,xSni:'',xWsPath:'/',xWsHost:''};
const pl=q.get('plugin');if(pl){const parts=decodeURIComponent(pl).split(';');if(!/v2ray-plugin|xray-plugin/.test(parts[0]))throw Error('Plugin "'+parts[0]+'" is not supported');o.xNet='ws';parts.slice(1).forEach(p=>{if(p==='tls')o.xTls=true;else if(p.startsWith('host=')){o.xWsHost=p.slice(5);o.xSni=p.slice(5)}else if(p.startsWith('path='))o.xWsPath=p.slice(5);else if(p==='mode=quic')throw Error('QUIC plugin mode is not supported')})}
if(!['aes-128-gcm','aes-256-gcm','chacha20-ietf-poly1305'].includes(method))throw Error('Cipher '+method+' is not supported (use aes-128-gcm, aes-256-gcm or chacha20-ietf-poly1305)');
return{o,name:frag}}
if(sc==='vless'||sc==='trojan'){const u=new URL(t);const q=u.searchParams;const net=q.get('type')||'tcp';
if(sc==='vless'&&q.get('flow'))throw Error('XTLS flow ('+q.get('flow')+') is not supported. Use a profile without flow.');
const sec=q.get('security')||(sc==='trojan'?'tls':'none');if(sec==='reality')throw Error('REALITY is not supported yet.');
if(!['tcp','ws'].includes(net))throw Error('Transport "'+net+'" is not supported (only tcp and ws).');
const o={tunnel:'v2',xProto:sc,xSecret:decodeURIComponent(u.username),xHost:u.hostname.replace(/^\[|\]$/g,''),xPort:u.port||'443',xNet:net,xTls:sec==='tls',xSni:q.get('sni')||q.get('peer')||'',xWsPath:q.get('path')?decodeURIComponent(q.get('path')):'/',xWsHost:q.get('host')||''};
if(q.get('allowInsecure')==='1')o.verify=false;return{o,name:frag}}
throw Error('Unsupported link type: '+sc)}

/* components */
const go=(n,a='')=>`<button class="row" data-go="${n}"><div class="t"><b>${a[0]}</b><small>${esc(a[1]||'')}</small></div>${ic('ch','ch')}</button>`;
const f=(l,k,o={})=>`<div class="fld"><label>${l}</label>${o.area?`<textarea data-k="${k}" ${o.ph?`placeholder="${o.ph}"`:''} spellcheck="false" autocapitalize="off">${esc(S[k])}</textarea>`:`<input data-k="${k}" value="${esc(S[k])}" ${o.t?`type="${o.t}"`:''} ${o.m?`inputmode="${o.m}"`:''} ${o.ph?`placeholder="${o.ph}"`:''} autocapitalize="off" autocomplete="off" spellcheck="false">`}${o.h?`<div class="h">${o.h}</div>`:''}</div>`;
const sw=(l,k,s='',re=0)=>`<label class="row"><div class="t"><b>${l}</b>${s?`<small style="white-space:normal">${s}</small>`:''}</div><input type="checkbox" class="sw" data-k="${k}" ${re?'data-re':''} ${S[k]?'checked':''}></label>`;
const rad=(k,v,l,dis,why)=>`<label class="row ${dis?'off':''}"><input type="radio" name="${k}" value="${v}" data-k="${k}" data-re ${S[k]===v?'checked':''}><div class="t"><b>${l}</b></div>${dis?`<span class="badge">${why||'Not supported'}</span>`:''}</label>`;
const card=(h,b)=>`<section class="card">${h?`<h3>${h}</h3>`:''}${b}</section>`;

const FROM={direct:'Direct',dpay:'Direct + Payload',sni:'Direct + SNI (TLS)',http:'HTTP proxy',socks5:'SOCKS5 proxy',socks4:'SOCKS4 proxy',tls:'TLS/SSL proxy',ws:'WebSocket'};
const METHODS=[
['smart','Smart (auto)','SSH + V2Ray, switches by itself',{tunnel:'smart'}],
['ssh','SSH Direct','',{tunnel:'ssh',from:'direct',custom:false}],
['sshp','SSH + Payload','',{tunnel:'ssh',from:'dpay'}],
['sshl','SSH + SSL','',{tunnel:'ssh',from:'sni',custom:false}],
['sshlp','SSH + SSL + Payload','',{tunnel:'ssh',from:'sni',custom:true}],
['http','HTTP Proxy','',{tunnel:'ssh',from:'http',custom:false}],
['httpp','HTTP Proxy + Payload','',{tunnel:'ssh',from:'http',custom:true}],
['httpslp','HTTP Proxy + SSL + Payload','',{tunnel:'ssh',from:'tls',custom:true}],
['v2','V2Ray / Xray','VMess, VLESS, Trojan',{tunnel:'v2'}],
['ss','Shadowsocks','',{tunnel:'ss'}],
['dnstt','SlowDNS (DNSTT)','SSH over DNS',{tunnel:'dnstt'}],
['dnsv2','DNSTT + V2Ray','V2Ray over DNS',{tunnel:'dnsv2'}],
['hy','Hysteria','QUIC with UDP',{tunnel:'hy'}]];
const methodId=()=>{if(S.tunnel==='smart')return'smart';if(S.tunnel==='v2')return'v2';if(S.tunnel==='ss')return'ss';if(S.tunnel==='hy'||S.tunnel==='dnstt'||S.tunnel==='dnsv2')return S.tunnel;if(S.tunnel!=='ssh')return'';const f=S.from,c=!!S.custom;return f==='direct'?'ssh':f==='dpay'?'sshp':f==='sni'?(c?'sshlp':'sshl'):f==='http'?(c?'httpp':'http'):f==='tls'&&c?'httpslp':''};
const methodName=()=>{const m=METHODS.find(x=>x[0]===methodId());return m?m[1]:(S.tunnel==='ssh'?'SSH (custom)':XN[S.tunnel]||'')};
const homeRows=()=>{const t=S.tunnel,xr=go('xserver',['V2Ray / Shadowsocks server',xdesc()]),hr=go('hyserver',['Hysteria server',hydesc()]),dr=go('dnstt',['DNS tunnel',dnsdesc()]);
return t==='smart'?card('',sshRow()+xr+hr):t==='ssh'?card('',sshRow()):t==='hy'?card('',hr):t==='dnstt'?card('',dr+sshRow()):t==='dnsv2'?card('',dr+xr):card('',go('xserver',[XN[t]+' server',xdesc()]))};
const serversCard=()=>{const t=S.tunnel,xr=go('xserver',['V2Ray / Shadowsocks server',xdesc()]),hr=go('hyserver',['Hysteria server',hydesc()]),dr=go('dnstt',['DNS tunnel',dnsdesc()]);
if(t==='ssh')return '';
if(t==='smart')return card('Servers',sshRow()+xr+hr)+'<div class="note">Smart tries your SSH server (with the proxy, SNI and payload above), your V2Ray / Shadowsocks server and your Hysteria server. It starts with the one that worked last and switches by itself when one fails. Fill in any of them.</div>';
if(t==='hy')return card('',hr)+'<div class="note">Hysteria runs over UDP (QUIC) and also carries the UDP traffic of your apps, such as calls and games. Some networks block UDP; then Hysteria cannot connect.</div>';
if(t==='dnstt')return card('',dr+sshRow())+'<div class="note">SlowDNS carries your SSH connection inside DNS queries. Set the DNS tunnel, then your SSH login (the SSH host is not used). Your DNSTT server must forward to its SSH port. It is slow but works where little else does.</div>';
if(t==='dnsv2')return card('',dr+xr)+'<div class="note">Your V2Ray / Shadowsocks connection travels inside DNS queries. Your DNSTT server must forward to your V2Ray port. The V2Ray address is only used as the TLS / WebSocket name.</div>';
return card('',xr.replace('V2Ray / Shadowsocks server',XN[t]+' server'))+'<div class="note">VMess, VLESS and Trojan work over TCP, TLS and WebSocket on any port. REALITY, XTLS flow and gRPC are not available in this build. VMess needs the phone clock to be accurate.</div>'};
const SSHY=()=>S.tunnel==='ssh'||S.tunnel==='smart';
const sshRow=()=>go('ssh',['SSH server',S._hjLocked?'Locked configuration':(S.user&&S.sshHost)?S.user+'@'+S.sshHost+':'+S.sshPort:'Not set']);
const XN={hy:'Hysteria',dnstt:'SlowDNS (DNSTT)',dnsv2:'DNSTT + V2Ray',smart:'Smart (auto)',ssh:'Secure Shell (SSH)',v2:'V2Ray / Xray',ss:'Shadowsocks',hy:'Hysteria'};
const xdesc=()=>S._hjLocked?'Locked configuration':S.xHost?`${S.tunnel==='ss'?'ss':S.xProto}://${S.xHost}:${S.xPort}`+(S.xNet==='ws'?' · ws':'')+(S.xTls?' · tls':''):'Not set';
const PAY=['http','tls','ws','sni','dpay'];
const payOn=()=>PAY.includes(S.from)&&(S.custom||S.from==='dpay');
const hydesc=()=>S._hjLocked?'Locked configuration':S.hyHost?`hysteria2://${S.hyHost}:${S.hyPort}`+(S.hyObfs?' · obfs':''):'Not set';
const dnsdesc=()=>S._hjLocked?'Locked configuration':S.dnsDomain?S.dnsDomain+' · '+(S.dnsMode==='doh'?'DoH':S.dnsMode==='dot'?'DoT':'UDP'):'Not set';
const sum=()=>S.tunnel==='hy'?'Hysteria · QUIC, carries UDP':S.tunnel==='dnstt'?'SSH over DNS (DNSTT)':S.tunnel==='dnsv2'?'V2Ray over DNS (DNSTT)':S.tunnel==='smart'?'SSH + V2Ray / Shadowsocks · picks the best route':S.tunnel!=='ssh'?`${XN[S.tunnel]} · ${S.tunnel==='ss'?'Shadowsocks':S.xProto.toUpperCase()}${S.xNet==='ws'?' + WebSocket':''}${S.xTls?' + TLS':''}`:`SSH ← ${FROM[S.from]}${payOn()?' (custom payload)':''}`;
const preview=()=>{const h=S.sshHost||'host',p=S.sshPort||'22';return esc(String(S.payload).split(/^[ \t]*-{3,}[ \t]*$/m)[0].trim().replace(/\[(host|ssh_host)\]/gi,h).replace(/\[(port|ssh_port)\]/gi,p).replace(/\[(host_port|ssh)\]/gi,h+':'+p).replace(/\[protocol\]/gi,'HTTP/1.1').replace(/\[method\]/gi,'CONNECT').replace(/\[(netdata|raw|realdata)\]/gi,'CONNECT '+h+':'+p+' HTTP/1.1').replace(/\[ua\]/gi,'Mozilla/5.0 (Linux; Android 13) …').replace(/\[sni\]/gi,S.sni||h).replace(/\[crlf\]/gi,'\\r\\n').replace(/\[lf\]/gi,'\\n').replace(/\[cr\]/gi,'\\r').replace(/\[rotate=([^\]]*)\]/gi,(m,x)=>x.split(';')[0]).replace(/\[(split|instant_split|delay_split)\]/gi,' ⟂ '))};
const modal=x=>{$('#sh').innerHTML=x;$('#md').classList.add('on')},unmodal=()=>$('#md').classList.remove('on');
const mf=(l,k,m)=>`<div class="fld" style="padding:0 0 12px;border:0"><label>${l}</label><input data-k="${k}" value="${esc(S[k])}" ${m?'inputmode="numeric"':''} autocapitalize="off" spellcheck="false"></div>`;
const mfa=(l,k,ph)=>`<div class="fld" style="padding:0 0 12px;border:0"><label>${l}</label><textarea data-k="${k}" placeholder="${ph||''}" style="min-height:74px" autocapitalize="off" spellcheck="false">${esc(S[k])}</textarea></div>`;
const EDIT={proxy:()=>modal(`<h2>Remote proxy</h2>${mfa('Host / IP (one or many)','pHost','1.2.3.4:8080, 5.6.7.8:3128')}${mf('Default port','pPort',1)}<p>Add several proxies, separated by comma, space or new line. Each connection starts at the next one, and a rejected proxy falls through to the next. An entry can be host, host:port or http://user:pass@host:port.</p><button class="btn pri" data-act="mdclose">Done</button>`),sni:()=>modal(`<h2>Server name (SNI)</h2>${mfa('Server name (one or many)','sni','example.com, cdn.example.net')}<p>Sent in the TLS handshake. Several names rotate, and a rejected one falls through to the next. With Verify on, the server certificate must be valid for the name.</p>${sw('Verify certificate','verify','Turn off only for your own server with a self-signed certificate or a borrowed SNI.')}<button class="btn pri" data-act="mdclose">Done</button>`)};
const ed=(k,t,v)=>`<button class="row" data-edit="${k}"><div class="t"><b>${t}</b><small>${esc(v)}</small></div>${ic('ed','ch')}</button>`;

const fmt=n=>{n=+n||0;const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return (i?n.toFixed(1):n|0)+' '+u[i]};
const dur=s=>{s=+s||0;const p=x=>String(x).padStart(2,'0');return `${p(s/3600|0)}:${p(s/60%60|0)}:${p(s%60)}`};

/* screens */
const V={
home(){const on=ST.state==='CONNECTED'||ST.state==='CONNECTING';
return `${S._hjLocked?'<div class="warn">This is a password-unlocked, owner-locked configuration. Editing is disabled.</div>':''}<button class="btn start ${on?'bad':'pri'}" data-act="${on?'stop':'start'}">${ST.state==='CONNECTING'?'Cancel':on?'Stop':'Start'}</button>
${card('',`<div class="st ${ST.state}"><span class="dot"></span><div style="flex:1"><b>${ST.state[0]+ST.state.slice(1).toLowerCase()}</b><div style="color:var(--mu);font-size:12.5px">${esc(ST.detail||(S._hjLocked?'Locked configuration':S.name))}</div></div>${ST.state==='CONNECTED'&&S.ping?`<span class="pg ${pingCls(STAT.ping??-2)}">${(STAT.ping??-2)===-2?'…':STAT.ping<0?'No reply':STAT.ping+' ms'}</span>`:''}</div>
<div class="stats"><div><b>${dur(STAT.uptime)}</b><small>Uptime</small></div><div><b>${fmt(STAT.downBps)}/s</b><small>Download</small></div><div><b>${fmt(STAT.upBps)}/s</b><small>Upload</small></div><div><b>${fmt(STAT.down)}</b><small>Downloaded</small></div><div><b>${fmt(STAT.up)}</b><small>Uploaded</small></div><div data-act="refreshIp" style="cursor:pointer"><b>${esc(getLocalIp()||'—')}</b><small>Local IP</small></div></div>${ST.error?`<div class="err" style="padding-top:12px">${esc(ST.error)}</div>`:''}`)}
${HJ.notes&&String(HJ.notes).trim()?card('Message from config owner',`<div class="fld" style="white-space:pre-wrap;line-height:1.5">${esc(HJ.notes)}</div>`):''}
${card('',go('tunnel',[methodName(),sum()]))}
${S._hjLocked?'':!SSHY()?'':payOn()?card('Payload',`<div class="fld" style="border:0"><textarea data-k="payload" spellcheck="false" autocapitalize="off" style="min-height:110px">${esc(S.payload)}</textarea></div>`+edRows()):(edRows()?card('',edRows()):'')}
${homeRows()}
${card('',`<label class="row"><div class="t"><b>${S._hjLocked?'DNS settings locked':`DNS (${S.dnsMode==='auto'?'Automatic':esc(S.dns1)})`}</b><small>${S._hjLocked?'Details hidden':S.dnsFwd?'Forwarded through tunnel':'Resolved locally'}</small></div></label>`+go('dns',['DNS and routing',S._hjLocked?'Locked':'Servers, routes, kill switch']))}
${card('',`<button class="row" data-act="tg" style="border:0;width:100%;text-align:left"><div class="t"><b>✈ Join our Telegram</b><small>Updates, configs and support · t.me/hometechnol</small></div></button>`)}`},

tunnel(){return card('Connection method',METHODS.map(m=>m[3]?`<button class="row" data-method="${m[0]}"><div class="t"><b>${m[1]}</b>${m[2]?`<small>${m[2]}</small>`:''}</div>${methodId()===m[0]?`<span class="pk">✓</span>`:''}</button>`:`<div class="row off"><div class="t"><b>${m[1]}</b></div><span class="badge">${m[4]}</span></div>`).join(''))+(methodId()===''?'<div class="note">Custom combination (set under Connect from below).</div>':'')
+(SSHY()?card('Connect from',Object.entries(FROM).map(([k,l])=>rad('from',k,l)).join(''))
+card('Options',sw('Custom payload','custom','Sent before the SSH handshake over HTTP, TLS or WebSocket transports.',1))
+'<div class="note">Direct + SNI connects straight to your server over TLS with the server name you choose. Leave the front address empty to use the SSH host.</div>'
:'')

+card('Speed',f('Upload (Mbps)','hyUp',{m:'numeric'})+f('Download (Mbps)','hyDown',{m:'numeric',h:'Optional. Leave both empty to let the server decide.'}))
+'<div class="note">Hysteria 2 over QUIC. It carries TCP and UDP.</div>'},

const yn=v=>v?'✔':'✖';
function exportSummary(){
let tt;if(S.tunnel==='hy')tt='Hysteria';else if(S.tunnel==='dnstt')tt='SlowDNS (DNSTT)';else if(S.tunnel==='dnsv2')tt='DNSTT + V2Ray';else if(S.tunnel==='smart')tt='Smart (SSH + '+(S.xProto==='ss'?'Shadowsocks':S.xProto.toUpperCase())+')';else if(S.tunnel==='ssh')tt=`${FROM[S.from]||S.from} → SSH${payOn()?' (Custom Payload)':''}`;else tt=`${XN[S.tunnel]} (${S.tunnel==='ss'?'Shadowsocks':S.xProto.toUpperCase()}${S.xNet==='ws'?' + WebSocket':''}${S.xTls?' + TLS':''})`;
const dns=S.dnsMode==='auto'?'Automatic':({'1.1.1.1':'Cloudflare DNS','1.0.0.1':'Cloudflare DNS','8.8.8.8':'Google DNS','8.8.4.4':'Google DNS','9.9.9.9':'Quad9 DNS'}[String(S.dns1).trim()]||(S.dns1||'Custom DNS'));
const routes=!S.defRoute||(S.appMode&&S.appMode!=='off'&&(S.apps||[]).length>0);
const rows=[['Tunnel Type',tt]];
if(SSHY()){rows.push(['SSH Port',S.sshPort]);rows.push(['SSH Private Key',yn(!!S.key)])}if(S.tunnel!=='ssh')rows.push(['Server Port',S.xPort]);
rows.push(['DNS Type',dns]);
return rows.map(r=>`<p><b>${esc(r[0])}:</b> ${esc(r[1])}</p>`).join('')+`<p style="margin-top:14px"><b>Custom Routes Enabled:</b> ${yn(routes)}</p>`}
function exportConfirm(kind){pendingKind=kind;modal(`<h2>Export config</h2>${exportSummary()}<div class="btns" style="margin-top:14px"><button class="btn" data-act="mdclose">Cancel</button><button class="btn pri" data-act="doExport">Export Config</button></div>`)}
function cloudOptions(){const r=(v,t,sub,ck)=>`<label class="row"><input type="radio" name="cm" value="${v}" ${ck?'checked':''} onchange="document.getElementById('cmDate').style.display=this.value==='expiry'?'block':'none'"><div class="t"><b>${t}</b>${sub?`<small style="white-space:normal">${sub}</small>`:''}</div></label>`;
modal(`<h2>Save to cloud</h2>${r('normal','Normal','Available until the server removes it (180 days by default).',1)}${r('burn','Burn after import','Deleted from the server after the first import.')}${r('expiry','Set Expiry Date','Deleted from the server after this date.')}<div class="fld" id="cmDate" style="display:none"><label>Available through the end of</label><input type="date" id="cloudDate"></div><div class="btns" style="margin-top:12px"><button class="btn" data-act="mdclose">Cancel</button><button class="btn pri" data-act="cloudGo">Export Config</button></div>`)}
function copyText(t,msg){if(B()&&B().copyText){B().copyText(t);toast(msg||'Copied')}else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast(msg||'Copied'),()=>toast('Copy failed'));else toast('Copy failed')}
function copyField(id){copyText(document.getElementById(id).value,'Copied')}
function cloudResultModal(r){const f=(ic,id,v)=>`<div class="cf"><input id="${id}" readonly value="${esc(v)}" aria-label="${ic}"><button onclick="copyField('${id}')">⧉</button></div>`;
const uri=String(r.uri||`${cloudServer()}/${encodeURIComponent(r.key)}`);
window._cloudAll=uri;
modal(`<h2>Cloud Config Key</h2><div class="h" style="margin:0 0 4px">Key</div>${f('key','cfKey',r.key)}<div class="h" style="margin:0 0 4px">Emoji key</div>${f('emoji','cfEmoji',r.emoji)}<div class="h" style="margin:0 0 4px">Share URI</div>${f('share URI','cfUri',uri)}<div class="btns"><button class="btn" data-act="mdclose">OK</button><button class="btn" onclick="B().shareText&&B().shareText(window._cloudAll)">Share</button><button class="btn pri" onclick="copyText(window._cloudAll,'Share URI copied')">Copy URI</button></div>`) }
function cloudFetchStart(input){try{if(!B()||!B().cloudFetch)throw Error('Cloud import is available only in the Android app');if(!String(input).trim())throw Error('Paste a link, key or emoji key');const id='d'+Date.now();reqs[id]='dl';toast('Fetching config…');B().cloudFetch(id,cloudServer(),String(input))}catch(e){toast(e.message)}}
JuanUI.cloudResult=(id,t)=>{const kind=reqs[id];delete reqs[id];let r;try{r=JSON.parse(t)}catch(e){toast('Cloud error');return}
if(kind==='ping'){toast(r.ok?r.text:r.error);return}
if(!r.ok){toast(r.error||'Cloud request failed');log('Cloud: '+(r.error||'failed'));return}
if(kind==='up'){clearHJPassword();cloudResultModal(r);log('Cloud: config uploaded')}
else if(kind==='dl'){unmodal();JuanUI.importFile(r.text)}};
JuanUI.cloudImportLink=u=>{nav('servers');cloudFetchStart(u)};

const ACT={
refreshIp(){try{getLocalIp();render();if(B()&&B().refreshIp)B().refreshIp();toast('Checking IP…')}catch(e){}},
tg(){if(B()&&B().openUrl)B().openUrl('https://t.me/hometechnol');else window.open('https://t.me/hometechnol','_blank')},
copyId(){B()&&B().copyText?(B().copyText(deviceId()),toast('Device ID copied')):toast('Available inside the Android app')},
shareId(){B()&&B().shareText?B().shareText('My JUAN VPN Device ID: '+deviceId()):toast('Available inside the Android app')},
useSim(){const c=B()&&B().simOperator?B().simOperator():'';if(!c){toast('No SIM detected');return}HJ.operatorCodes=(String(HJ.operatorCodes||'').trim()?HJ.operatorCodes.trim()+'\n':'')+c;saveHJ();render()},
quick(){modal(`<h2>Configuration actions</h2><div class="quick-actions"><button class="btn pri" data-act="saveQuick">Save current profile<span>Keep it in Saved profiles</span></button><button class="btn" data-act="goImportSel">Import config<span>From storage or cloud code</span></button><button class="btn" data-act="openExporter">Export .HJ<span>Create a locked or unlocked file</span></button><button class="btn" data-act="openServers">Saved profiles<span>Open saved configurations</span></button><button class="btn bad" data-act="askReset">Reset current config<span>Clear server and choose another protocol</span></button></div><div class="btns"><button class="btn sm" data-act="mdclose">Close</button></div>`)},
askReset(){modal(`<h2>Reset current configuration?</h2><p>This disconnects the VPN and clears the active server, credentials, payload, proxy, SNI and current protocol. Saved profiles and .HJ export settings will remain.</p><div class="btns"><button class="btn" data-act="mdclose">Cancel</button><button class="btn bad" data-act="confirmReset">Reset configuration</button></div>`)},
confirmReset(){try{if(B()&&B().disconnect)B().disconnect();S={...D};S._hjLocked=false;SECRET.forEach(k=>S[k]='');if(B()&&B().saveSecrets)B().saveSecrets(JSON.stringify(Object.fromEntries(SECRET.map(k=>[k,'']))));save();ST={state:'DISCONNECTED',detail:'',error:''};unmodal();log('Current configuration reset');toast('Configuration reset. Choose a new protocol or import a file.');nav('home')}catch(e){toast('Reset failed: '+e.message)}},
openExporter(){unmodal();nav('exporter')},
saveQuick(){unmodal();ACT.saveP()},
openServers(){unmodal();nav('servers')},
impLink(){try{const r=parseLink(S.link),was=S.tunnel;Object.assign(S,r.o);if(was==='smart'||was==='dnsv2'){S.xProto=r.o.tunnel==='ss'?'ss':(r.o.xProto||S.xProto);S.tunnel=was}if(r.name)S.name=r.name;S.link='';save();if(B()&&B().saveSecrets)B().saveSecrets(JSON.stringify(Object.fromEntries(SECRET.map(k=>[k,S[k]||'']))));log('Link imported: '+S.tunnel+' '+S.xHost+':'+S.xPort);toast('Link imported');render()}catch(x){toast(x.message);log('Import failed: '+x.message)}},
forget(){S.known='';save();B()&&B().forgetHostKey&&B().forgetHostKey(S.sshHost,String(S.sshPort));toast('Trusted key cleared');render()},
mdclose(){unmodal();render()},hkyes(){B()&&B().hostKeyAnswer&&B().hostKeyAnswer(true);unmodal()},hkno(){B()&&B().hostKeyAnswer&&B().hostKeyAnswer(false);unmodal()},
start(){const e=validate();if(e.length){ST.error=e[0];log('Validation failed: '+e[0]);render();return}
ST={state:'CONNECTING',detail:'Starting…',error:''};log('Connect requested for '+S.name);render();
if(B()&&B().connect)B().connect(JSON.stringify({...S,_policy:policyObj()}));else{ST={state:'ERROR',detail:'',error:'Native tunnel engine is not attached to this UI.'};log('No native bridge: cannot connect');render()}},
stop(){log('Disconnect requested');B()&&B().disconnect&&B().disconnect();ST={state:'DISCONNECTED',detail:'',error:''};render()},
notif(){B()&&B().notifPerm?B().notifPerm():toast('Available inside the Android app')},
batt(){B()&&B().batteryHelp?B().batteryHelp():toast('Available inside the Android app')},
rl(){render()},clr(){LOG=[];B()&&B().clearLogs&&B().clearLogs();render()},nl(){B()&&B().nativeLog?B().nativeLog():toast('Available inside the Android app')},
cl(){navigator.clipboard?.writeText(LOG.join('\n')).then(()=>toast('Logs copied'),()=>toast('Copy failed'))},
xl(){dl('juanvpn-log.txt',LOG.join('\n'),'text/plain')},
saveP(){if(S._hjLocked){toast('Owner-locked configuration cannot be saved as an editable profile.');return}let L=JSON.parse(localStorage.getItem('juan.l')||'[]');const c=pub();const i=L.findIndex(x=>x.name===c.name);i>=0?L[i]=c:L.push(c);localStorage.setItem('juan.l',JSON.stringify(L));toast('Profile saved');render()},
exportP(){dl('juanvpn-profile.json',JSON.stringify({format:'juanvpn-profile-v2',...pub()},null,2),'application/json')},
importP(){B()&&B().chooseImport?B().chooseImport():$('#fi').click()},
exporter(){nav('exporter')},
goImportSel(){unmodal();nav('importsel')},
importHJ(){unmodal();B()&&B().chooseImport?B().chooseImport():$('#fi').click()},
saveHJ(){try{const locked=!!HJ.lockConfig;const text=makeHJText(locked);clearHJPassword();dl(hjName(),text,'application/octet-stream');toast('Choose a location to save your .HJ file')}catch(e){toast(e.message)}},
saveBothHJ(){try{if(!HJ.lockConfig){HJ.lockConfig=true;saveHJ();render();toast('Set a password, then tap Save locked & unlocked again');return}const unlocked=makeHJText(false),locked=makeHJText(true);clearHJPassword();if(!B()||!B().exportFiles)throw Error('Save both is available only in the Android app');B().exportFiles(hjName('-unlocked'),unlocked,hjName('-locked'),locked);toast('Choose where to save each .HJ file')}catch(e){toast(e.message)}},
shareHJ(){try{const text=makeHJText(!!HJ.lockConfig);clearHJPassword();if(!B()||!B().shareFile)throw Error('Sharing is available only in the Android app');B().shareFile(hjName(),text)}catch(e){toast(e.message)}},
fab(){const f=document.querySelector('.fabwrap');if(f)f.classList.toggle('open')},
xSave(){exportConfirm('saveHJ')},xCode(){exportConfirm('codeHJ')},xBoth(){exportConfirm('saveBothHJ')},xShare(){exportConfirm('shareHJ')},
saveCloudHJ(){cloudOptions()},xCloud(){cloudOptions()},
doExport(){unmodal();ACT[pendingKind]()},
codeHJ(){try{if(!B()||!B().makeCode)throw Error('Available only in the Android app');const text=makeHJText(!!HJ.lockConfig);const code=B().makeCode(text);if(String(code).startsWith('ERROR:'))throw Error(String(code).slice(6));clearHJPassword();window._code=code;copyText(code,'Config code copied');modal(`<h2>Config code</h2><p>No server needed. Send this text to the user; they paste it in Import from cloud key.</p><div class="fld" style="padding:8px 0"><textarea id="codeOut" readonly style="min-height:110px;font:12px ui-monospace,Menlo,monospace">${esc(code)}</textarea></div><div class="btns"><button class="btn" data-act="mdclose">OK</button><button class="btn" onclick="B().shareText&&B().shareText(window._code)">Share</button><button class="btn pri" onclick="copyText(window._code,'Copied')">Copy</button></div>`)}catch(e){toast(e.message)}},
cloudGo(){try{const mode=(document.querySelector('input[name=cm]:checked')||{}).value||'normal';let exp=0;
if(mode==='expiry'){const d=$('#cloudDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw Error('Choose an expiry date');exp=new Date(d+'T23:59:59').getTime();if(!(exp>Date.now()))throw Error('Expiry date must be in the future')}
const srv=cloudServer();if(!B()||!B().cloudUpload)throw Error('Cloud upload is available only in the Android app');
const text=makeHJText(!!HJ.lockConfig);const id='u'+Date.now();reqs[id]='up';toast('Uploading…');B().cloudUpload(id,srv,text,mode,Math.floor(exp/1000))}catch(e){toast(e.message)}},
cloudImport(){modal(`<h2>Import from cloud</h2><p>Paste the cloud key, the emoji key, or a config code (JUAN1:…).</p><div class="fld" style="padding:8px 0"><textarea id="cloudIn" spellcheck="false" autocapitalize="off" placeholder="key, emoji key or JUAN1:… code" style="min-height:70px"></textarea></div><div class="btns"><button class="btn" data-act="mdclose">Cancel</button><button class="btn pri" data-act="cloudFetchGo">Import</button></div>`)},
cloudFetchGo(){cloudFetchStart($('#cloudIn')?.value||'')},
decryptHJ(){try{const pw=$('#hjImportPassword')?.value||'';if(!B()||!B().openHJ)throw Error('HJ decryption is available only in the Android app');const raw=B().openHJ(pendingHJText,pw);if(String(raw).startsWith('ERROR:'))throw Error(String(raw).slice(6));pendingHJText='';unmodal();applyHJConfig(JSON.parse(raw),true)}catch(e){toast(e.message)}}};
const pub=()=>{const c={...S};SECRET.forEach(k=>delete c[k]);return c};
function dl(n,t,m){if(B()&&B().exportFile){B().exportFile(n,t);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-edit],[data-go],[data-act],[data-tool],[data-tpl],[data-use],[data-del]');if(!t)return;const d=t.dataset;
if(d.edit)EDIT[d.edit]();else if(d.go)nav(d.go);else if(d.act)ACT[d.act]();
else if(d.tpl){S.payload=TPL[d.tpl];save();render()}
else if(d.tool){const h=S._hjLocked?S.tHost:(S.tHost||S.sshHost);if(!h&&d.tool!=='ip'){toast('Enter a host first');return}
if(B()&&B().tool){toolOut='Running…';render();B().tool(d.tool,JSON.stringify(S._hjLocked?{host:h,port:'22',proxy:'',sni:''}:{host:h,port:S.sshPort,proxy:S.pHost+':'+S.pPort,sni:S.sni}))}else{toolOut='Tests run in the Android app.';render()}}
else if(d.use!=null){const L=JSON.parse(localStorage.getItem('juan.l')||'[]');S={...D,...L[d.use]};save();toast('Profile loaded');nav('home')}
else if(d.del!=null){const L=JSON.parse(localStorage.getItem('juan.l')||'[]');L.splice(d.del,1);localStorage.setItem('juan.l',JSON.stringify(L));render()}});
document.addEventListener('input',e=>{const el=e.target,d=el.dataset;
if(d.hj){HJ[d.hj]=el.type==='checkbox'?el.checked:el.value;saveHJ();if(RR.includes(d.hj))render();return}
if(d.app){const s=new Set(S.apps);el.checked?s.add(d.app):s.delete(d.app);S.apps=[...s];save();return}
if(!d.k)return;S[d.k]=el.type==='checkbox'?el.checked:el.value;if(d.k!=='tHost')save();if(d.k==='ping'||d.k==='pingUrl')pushPing();
if(SECRET.includes(d.k)&&B()&&B().saveSecrets)B().saveSecrets(JSON.stringify({[d.k]:S[d.k]||''}));
if(d.re){render()}else if(['sni','pHost','sshHost','payload'].includes(d.k)){const p=document.querySelector('.pv');if(p)p.innerHTML=preview()}});
document.addEventListener('change',e=>{if(e.target.dataset.hj){HJ[e.target.dataset.hj]=e.target.type==='checkbox'?e.target.checked:e.target.value;saveHJ();if(RR.includes(e.target.dataset.hj))render();return}if(e.target.id!=='fi')return;const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{window.JuanUI.importFile(t);e.target.value=''})});
render();
setTimeout(()=>{try{if(ST.state==='DISCONNECTED'&&B()&&B().refreshIp)B().refreshIp()}catch(e){}},1200);
setTimeout(pushPing,600);
document.addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;const m=METHODS.find(x=>x[0]===b.dataset.method);if(!m||!m[3])return;Object.assign(S,m[3]);if(m[0]==='v2'&&S.xProto==='ss')S.xProto='vless';save();render()});
</script></body></html>
